name: Docker Build & Publish

on:
  # 手动触发：可指定任意镜像 tag
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

  push:
    # 推送到 main 分支 → 自动构建并推送 latest
    branches:
      - main
    # 推送 v* 标签 → 自动构建并推送对应版本号镜像
    tags:
      - 'v*'

# 避免同一 ref 的并发构建互相覆盖
concurrency:
  group: build-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # ghcr.io 要求仓库路径全小写，GitHub 登录名大小写不敏感，用全小写形式确保合法
  IMAGE_NAME: bigricefrog/wrong-notebook-v2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 根据触发方式决定镜像 tag：
      #   手动触发      → 使用输入的 tag（默认 latest）
      #   推送 v* 标签  → 使用标签名（如 v1.11.2）
      #   推送 main     → latest
      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag resolved to: ${TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
